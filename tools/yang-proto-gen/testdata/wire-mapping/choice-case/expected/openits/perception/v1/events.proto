syntax = "proto3";

package openits.perception.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/perception/v1;perceptionv1";

message ObjectDetected {
  string object_id = 1;
  oneof position {
    string zone_name = 2;
    uint32 pixel_index = 3;
    Geo geo = 4;
  }
  optional uint32 confidence = 5;
  oneof track {
    uint32 track_points = 6;
    string track_ref = 7;
  }
  message Geo {
    string latitude = 1;
    string longitude = 2;
    oneof datum {
      string wgs84 = 3;
      uint32 epsg_code = 4;
    }
  }
}

