syntax = "proto3";

package openits.ess.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/ess/v1;essv1";

import "openits/ess/v1/types.proto";

message WeatherStation {
  WeatherStationConfig config = 1;
  repeated WeatherStationSensor sensor = 2;
  Gate gate = 3;
}

message WeatherStationConfig {
  optional string site_name = 1;
}

message WeatherStationSensor {
  optional uint32 id = 1;
}

message Gate {
  optional GateState position = 1;
  GateGateState state = 2;
}

message GateGateState {
  optional bool moving = 1;
}

