syntax = "proto3";

package openits.dms.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/dms/v1;dmsv1";

import "google/protobuf/timestamp.proto";
import "openits/types/v1/types.proto";

message MessageActivationFailed {
  string kind = 99;
  MessageMemoryType attempted_memory_type = 1;
  uint32 attempted_slot_number = 2;
  string reason = 3;
  ErrorType error_type = 9;
  uint32 error_position = 10;
  Phase phase = 11;
  string observed_by = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string owner = 6;
  uint64 sequence = 7;
  openits.types.v1.WireSource source = 100;
  string source_device_id = 8;
}

enum MessageMemoryType {
  MESSAGE_MEMORY_TYPE_UNSPECIFIED = 0;
  MESSAGE_MEMORY_TYPE_PERMANENT = 1;
  MESSAGE_MEMORY_TYPE_CHANGEABLE = 2;
  MESSAGE_MEMORY_TYPE_VOLATILE = 3;
  MESSAGE_MEMORY_TYPE_SCHEDULE = 4;
  MESSAGE_MEMORY_TYPE_BLANK = 5;
}

enum ErrorType {
  ERROR_TYPE_SYNTAX = 0;
  ERROR_TYPE_UNSUPPORTED_TAG = 1;
  ERROR_TYPE_FONT_NOT_FOUND = 2;
  ERROR_TYPE_GRAPHIC_NOT_FOUND = 3;
  ERROR_TYPE_TOO_LONG = 4;
  ERROR_TYPE_HARDWARE = 5;
  ERROR_TYPE_OTHER = 6;
}

enum Phase {
  PHASE_ACTIVATE = 0;
  PHASE_VALIDATE = 1;
}

message MessageChanged {
  string kind = 99;
  MessageMemoryType memory_type = 1;
  uint32 slot_number = 2;
  string multi_string = 3;
  uint32 crc = 4;
  string activation_trigger = 5;
  MessageMemoryType prior_memory_type = 6;
  uint32 prior_slot_number = 7;
  string prior_multi_string = 8;
  string observed_by = 9;
  google.protobuf.Timestamp occurred_at = 10;
  string owner = 11;
  uint64 sequence = 12;
  openits.types.v1.WireSource source = 100;
  string source_device_id = 13;
}

message SignStatusReport {
  string kind = 99;
  string display_state = 1;
  uint32 brightness_current = 2;
  uint32 ambient_light_level = 3;
  uint32 ambient_illuminance_lux = 4;
  string cabinet_temperature_c = 5;
  string sign_face_temperature_c = 6;
  uint32 humidity_percent = 7;
  bool door_open = 8;
  bool fan_active = 9;
  bool heater_active = 10;
  string observed_by = 11;
  google.protobuf.Timestamp occurred_at = 12;
  string owner = 13;
  uint64 sequence = 14;
  string source_device_id = 15;
}

