syntax = "proto3";

package openits.dms.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/dms/v1;dmsv1";

import "google/protobuf/timestamp.proto";
import "openits/dms/v1/types.proto";
import "openits/types/v1/types.proto";

message MessageActivationFailed {
  string kind = 99;
  optional MessageMemoryType attempted_memory_type = 1;
  optional uint32 attempted_slot_number = 2;
  optional string reason = 3;
  optional string error_type = 9;
  optional uint32 error_position = 10;
  optional Phase phase = 11;
  optional string observed_by = 4;
  google.protobuf.Timestamp occurred_at = 5;
  optional string owner = 6;
  uint64 sequence = 7;
  openits.types.v1.WireSource source = 100;
  string source_device_id = 8;
}

message MessageChanged {
  string kind = 99;
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
  optional string multi_string = 3;
  optional uint32 crc = 4;
  optional string activation_trigger = 5;
  optional MessageMemoryType prior_memory_type = 6;
  optional uint32 prior_slot_number = 7;
  optional string prior_multi_string = 8;
  optional string observed_by = 9;
  google.protobuf.Timestamp occurred_at = 10;
  optional string owner = 11;
  uint64 sequence = 12;
  openits.types.v1.WireSource source = 100;
  string source_device_id = 13;
}

message SignStatusReport {
  string kind = 99;
  optional string display_state = 1;
  optional uint32 brightness_current = 2;
  optional uint32 ambient_light_level = 3;
  optional uint32 ambient_illuminance_lux = 4;
  optional string cabinet_temperature_c = 5;
  optional string sign_face_temperature_c = 6;
  optional uint32 humidity_percent = 7;
  optional bool door_open = 8;
  optional bool fan_active = 9;
  optional bool heater_active = 10;
  optional string observed_by = 11;
  google.protobuf.Timestamp occurred_at = 12;
  optional string owner = 13;
  uint64 sequence = 14;
  string source_device_id = 15;
}

