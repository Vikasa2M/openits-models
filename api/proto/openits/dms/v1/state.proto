syntax = "proto3";

package openits.dms.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/dms/v1;dmsv1";

import "google/protobuf/timestamp.proto";
import "openits/dms/v1/types.proto";

message Sign {
  SignConfig config = 1;
  SignState state = 2;
  Messages messages = 3;
  Schedule schedule = 8;
  Control control = 4;
  Environment environment = 5;
  CabinetPower cabinet_power = 9;
  Diagnostics diagnostics = 6;
  Faults faults = 7;
}

message SignConfig {
  optional string elevation = 5;
  optional uint32 heading = 6;
  optional string id = 7;
  google.protobuf.Timestamp install_date = 1;
  optional string latitude = 2;
  SignConfigLinearReference linear_reference = 4;
  optional string longitude = 3;
  optional string maintained_by = 10;
  optional string name = 8;
  optional string owner = 11;
  optional string road_reference = 9;
  optional string site_id = 12;
}

message SignConfigLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message SignState {
  optional string technology = 1;
  optional uint32 sign_width_pixels = 2;
  optional uint32 sign_height_pixels = 3;
  Capabilities capabilities = 5;
  optional string elevation = 12;
  optional string firmware = 4;
  optional string firmware_build = 17;
  optional string hardware_version = 18;
  optional uint32 heading = 13;
  optional string id = 14;
  google.protobuf.Timestamp install_date = 11;
  optional string latitude = 6;
  SignStateLinearReference linear_reference = 19;
  optional string longitude = 7;
  optional string maintained_by = 20;
  optional string make = 8;
  optional string model = 9;
  optional string name = 15;
  optional string owner = 21;
  optional string road_reference = 16;
  optional string serial = 10;
  optional string site_id = 22;
}

message Capabilities {
  optional SignType sign_type = 1;
  optional uint32 character_height_pixels = 2;
  optional uint32 character_width_pixels = 3;
  optional uint32 sign_face_height_mm = 9;
  optional uint32 sign_face_width_mm = 10;
  optional string pixel_pitch_mm = 14;
  optional uint32 character_height_mm = 11;
  optional uint32 character_width_mm = 12;
  optional BeaconType beacon_type = 13;
  optional ColorCapability color_capability = 4;
  optional uint32 max_pages = 5;
  optional bool beacon_capable = 6;
  repeated string supported_multi_tags = 7;
  repeated Font font = 8;
  repeated Graphic graphic = 15;
}

message Font {
  optional uint32 font_number = 1;
  optional string name = 2;
  optional uint32 character_height_pixels = 3;
  optional uint32 character_width_pixels = 4;
}

message Graphic {
  optional uint32 graphic_number = 1;
  optional string name = 2;
  optional uint32 height_pixels = 3;
  optional uint32 width_pixels = 4;
}

message SignStateLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message Messages {
  repeated Slot slot = 1;
}

message Slot {
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
  SlotConfig config = 7;
  SlotState state = 8;
}

message SlotConfig {
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
  optional Beacon beacon = 3;
  optional uint32 crc = 4;
  optional string multi_string = 5;
  optional string owner = 6;
  optional uint32 priority = 7;
}

message SlotState {
  optional uint32 crc = 2;
  optional DmsMessageStatus status = 1;
}

message Schedule {
  repeated DayPlan day_plan = 1;
  repeated ScheduleEntry schedule_entry = 2;
  ScheduleState state = 3;
}

message DayPlan {
  optional uint32 day_plan_id = 1;
  optional string name = 2;
  repeated Action action = 3;
}

message Action {
  optional string start_time = 1;
  MessageMemoryType memory_type = 2;
  optional uint32 slot_number = 3;
}

message ScheduleEntry {
  optional uint32 schedule_id = 1;
  optional uint32 day_plan = 5;
  repeated uint32 days_of_month = 4;
  repeated DayOfWeek days_of_week = 3;
  repeated Month months = 2;
}

message ScheduleState {
  optional uint32 active_day_plan_id = 1;
  google.protobuf.Timestamp next_action_at = 2;
}

message Control {
  ControlConfig config = 1;
  ControlState state = 2;
}

message ControlConfig {
  optional RequestSelfTest request_self_test = 7;
  ActiveMessage active_message = 4;
  ControlConfigFallback fallback = 5;
  optional uint32 brightness_setpoint = 6;
  optional string control_mode = 11;
  optional string default_page_off_time_s = 1;
  optional string default_page_on_time_s = 2;
  optional IlluminationControl illumination_control = 3;
}

message ActiveMessage {
  optional uint32 duration_s = 3;
  optional bool indefinite = 7;
  optional uint32 activation_priority = 4;
  optional uint32 crc = 5;
  optional string owner = 6;
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
}

message ControlConfigFallback {
  ControlConfigFallbackCommLoss comm_loss = 1;
  ControlConfigFallbackEndOfDuration end_of_duration = 2;
  ControlConfigFallbackPowerRecovery power_recovery = 3;
  ControlConfigFallbackReset reset = 4;
}

message ControlConfigFallbackCommLoss {
  optional uint32 comm_loss_timeout_s = 1;
  optional MessageMemoryType memory_type = 2;
  optional uint32 slot_number = 3;
}

message ControlConfigFallbackEndOfDuration {
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
}

message ControlConfigFallbackPowerRecovery {
  optional uint32 short_outage_threshold_s = 1;
  ControlConfigFallbackPowerRecoveryShortOutage short_outage = 2;
  ControlConfigFallbackPowerRecoveryLongOutage long_outage = 3;
}

message ControlConfigFallbackPowerRecoveryShortOutage {
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
}

message ControlConfigFallbackPowerRecoveryLongOutage {
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
}

message ControlConfigFallbackReset {
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
}

message ControlState {
  reserved 11;
  reserved "controller_uptime_s";
  optional string display_state = 21;
  optional BeaconState beacon_state = 6;
  google.protobuf.Timestamp last_mode_change = 2;
  optional uint32 brightness_current = 8;
  Active active = 9;
  Preempted preempted = 5;
  ControlStateFallback fallback = 7;
  optional bool comm_loss_active = 10;
  optional bool power_loss_active = 22;
  optional uint32 brightness_setpoint = 12;
  optional string control_mode = 23;
  optional string default_page_off_time_s = 1;
  optional string default_page_on_time_s = 3;
  optional IlluminationControl illumination_control = 4;
}

message Active {
  google.protobuf.Timestamp activated_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  optional string source = 5;
  optional string activation_trigger = 10;
  optional Beacon beacon = 11;
  optional uint32 crc = 6;
  optional MessageMemoryType memory_type = 1;
  optional string multi_string = 7;
  optional string owner = 8;
  optional uint32 priority = 9;
  optional uint32 slot_number = 2;
}

message Preempted {
  optional uint32 remaining_duration_s = 3;
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
}

message ControlStateFallback {
  ControlStateFallbackCommLoss comm_loss = 1;
  ControlStateFallbackEndOfDuration end_of_duration = 2;
  ControlStateFallbackPowerRecovery power_recovery = 3;
  ControlStateFallbackReset reset = 4;
}

message ControlStateFallbackCommLoss {
  optional uint32 comm_loss_timeout_s = 1;
  optional MessageMemoryType memory_type = 2;
  optional uint32 slot_number = 3;
}

message ControlStateFallbackEndOfDuration {
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
}

message ControlStateFallbackPowerRecovery {
  optional uint32 short_outage_threshold_s = 1;
  ControlStateFallbackPowerRecoveryShortOutage short_outage = 2;
  ControlStateFallbackPowerRecoveryLongOutage long_outage = 3;
}

message ControlStateFallbackPowerRecoveryShortOutage {
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
}

message ControlStateFallbackPowerRecoveryLongOutage {
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
}

message ControlStateFallbackReset {
  optional MessageMemoryType memory_type = 1;
  optional uint32 slot_number = 2;
}

message Environment {
  reserved 1;
  reserved "ambient_light_lux";
  optional uint32 ambient_light_level = 8;
  optional uint32 ambient_illuminance_lux = 9;
  optional string cabinet_temperature_c = 2;
  optional uint32 humidity_percent = 3;
  optional bool door_open = 4;
  optional string sign_face_temperature_c = 5;
  optional bool fan_active = 6;
  optional bool heater_active = 7;
}

message CabinetPower {
  reserved 1;
  reserved "config";
  CabinetPowerState state = 2;
}

message CabinetPowerState {
  reserved 6, 7, 9;
  reserved "on_battery_policy", "police_panel_open", "signal_operation_on_battery";
  Battery battery = 1;
  optional bool door_open = 2;
  Generator generator = 3;
  optional string line_frequency_hz = 4;
  optional string line_voltage_v = 5;
  optional PowerSource power_source = 8;
  optional uint32 transfer_count = 10;
}

message Battery {
  optional uint32 state_of_charge_pct = 1;
  optional uint32 runtime_remaining_minutes = 2;
  optional string voltage_v = 3;
  optional string temperature_c = 4;
  optional bool charger_fault = 5;
  optional BatteryTestState test_state = 6;
  google.protobuf.Timestamp last_test = 7;
}

message Generator {
  optional bool running = 1;
  optional uint32 fuel_level_pct = 2;
}

message Diagnostics {
  optional uint32 pixels_total = 11;
  optional uint32 pixels_stuck_on = 1;
  optional uint32 pixels_stuck_off = 2;
  optional uint32 pixels_failed = 12;
  optional uint32 lamps_total = 13;
  optional uint32 lamps_failed = 14;
  optional uint32 beacons_total = 4;
  optional uint32 beacons_failed = 5;
  optional uint32 controller_uptime_s = 6;
  google.protobuf.Timestamp last_self_test = 3;
}

message Faults {
  repeated Fault fault = 1;
}

message Fault {
  optional string category = 1;
  optional string correlates_with = 6;
  optional string description = 2;
  optional string fault_id = 3;
  google.protobuf.Timestamp first_observed = 4;
  optional FaultSeverity severity = 5;
}

