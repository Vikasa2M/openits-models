syntax = "proto3";

package openits.reversible_lane.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/reversible_lane/v1;reversiblelanev1";

import "google/protobuf/timestamp.proto";
import "openits/reversible_lane/v1/types.proto";

message ReversibleLane {
  ReversibleLaneConfig config = 1;
  ReversibleLaneState state = 2;
  Control control = 3;
  Gates gates = 7;
  Segments segments = 4;
  Interlocks interlocks = 5;
  Faults faults = 6;
}

message ReversibleLaneConfig {
  optional string direction_a = 1;
  optional string direction_b = 2;
  optional string elevation = 3;
  optional uint32 heading = 4;
  optional string id = 5;
  google.protobuf.Timestamp install_date = 10;
  optional string latitude = 6;
  ReversibleLaneConfigLinearReference linear_reference = 11;
  optional string longitude = 7;
  optional string maintained_by = 12;
  optional string name = 8;
  optional string owner = 13;
  optional string road_reference = 9;
  optional string site_id = 14;
}

message ReversibleLaneConfigLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message ReversibleLaneState {
  optional string elevation = 1;
  optional string firmware = 2;
  optional string firmware_build = 12;
  optional string hardware_version = 13;
  optional uint32 heading = 3;
  optional string id = 4;
  google.protobuf.Timestamp install_date = 14;
  optional string latitude = 5;
  ReversibleLaneStateLinearReference linear_reference = 15;
  optional string longitude = 6;
  optional string maintained_by = 16;
  optional string make = 7;
  optional string model = 8;
  optional string name = 9;
  optional string owner = 17;
  optional string road_reference = 10;
  optional string serial = 11;
  optional string site_id = 18;
}

message ReversibleLaneStateLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message Control {
  ControlConfig config = 1;
  ControlState state = 2;
}

message ControlConfig {
  optional TargetState target_state = 7;
  optional string target_direction = 8;
  optional uint32 transition_timeout_s = 9;
  optional uint32 min_clearance_duration_s = 1;
  optional uint32 min_verification_dwell_s = 2;
}

message ControlState {
  optional LaneFlowState current_state = 13;
  optional string open_direction = 14;
  optional string last_command_source = 15;
  google.protobuf.Timestamp last_command_at = 16;
  optional bool changeover_permitted = 19;
  optional bool direction_open_permitted = 1;
  repeated string blocking_interlocks = 20;
  Transition transition = 17;
}

message Transition {
  optional Phase phase = 1;
  optional string from_direction = 2;
  optional string to_direction = 3;
  google.protobuf.Timestamp started_at = 4;
  optional string sequence_step = 5;
}

message Gates {
  repeated Gate gate = 1;
}

message Gate {
  reserved 3;
  reserved "state";
  optional string gate_id = 1;
  GateConfig config = 2;
  Readback readback = 4;
}

message GateConfig {
  optional string gate_id = 1;
  optional string name = 2;
  optional string gate_type = 3;
  optional string segment_id = 4;
  optional string protects_direction = 5;
  optional string interlock_role = 6;
}

message Readback {
  google.protobuf.Timestamp measured_at = 1;
  optional string operating_mode = 2;
  optional GatePosition position = 3;
}

message Segments {
  repeated Segment segment = 1;
}

message Segment {
  optional string segment_id = 1;
  SegmentConfig config = 2;
  repeated Lane lane = 3;
}

message SegmentConfig {
  optional string segment_id = 1;
  optional string name = 2;
}

message Lane {
  optional string lane_id = 1;
  LaneConfig config = 15;
  LaneState state = 16;
}

message LaneConfig {
  optional string lane_id = 2;
  optional LcsIndication lcs_direction_a = 3;
  optional LcsIndication lcs_direction_b = 4;
}

message LaneState {
  optional LcsIndication lcs_direction_a = 5;
  optional LcsIndication lcs_direction_b = 6;
  optional GateState gate_state = 7;
}

message Interlocks {
  repeated Interlock interlock = 2;
}

message Interlock {
  optional string interlock_id = 1;
  InterlockConfig config = 4;
  InterlockState state = 5;
}

message InterlockConfig {
  optional string interlock_id = 1;
  string kind = 99;
  optional string name = 2;
  optional bool required = 3;
  EvaluationPoint evaluation_point = 4;
}

message InterlockState {
  optional bool satisfied = 1;
}

message Faults {
  repeated Fault fault = 1;
}

message Fault {
  optional string category = 1;
  optional string correlates_with = 6;
  optional string description = 2;
  optional string fault_id = 3;
  google.protobuf.Timestamp first_observed = 4;
  optional FaultSeverity severity = 5;
}

