syntax = "proto3";

package openits.ess.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/ess/v1;essv1";

import "google/protobuf/timestamp.proto";
import "openits/ess/v1/types.proto";

message Station {
  StationConfig config = 1;
  StationState state = 2;
  Configuration configuration = 10;
  Atmospheric atmospheric = 3;
  Precipitation precipitation = 4;
  Visibility visibility = 5;
  Pavement pavement = 6;
  Radiation radiation = 7;
  Diagnostics diagnostics = 8;
  Faults faults = 9;
}

message StationConfig {
  optional string elevation = 7;
  optional uint32 heading = 8;
  optional string id = 9;
  google.protobuf.Timestamp install_date = 1;
  optional string latitude = 2;
  StationConfigLinearReference linear_reference = 6;
  optional string longitude = 3;
  optional string maintained_by = 10;
  optional string name = 4;
  optional string owner = 11;
  optional string road_reference = 5;
  optional string site_id = 12;
}

message StationConfigLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message StationState {
  optional string elevation = 11;
  optional string firmware = 2;
  optional string firmware_build = 14;
  optional string hardware_version = 15;
  optional uint32 heading = 12;
  optional string id = 13;
  google.protobuf.Timestamp install_date = 1;
  optional string latitude = 3;
  StationStateLinearReference linear_reference = 10;
  optional string longitude = 4;
  optional string maintained_by = 16;
  optional string make = 5;
  optional string model = 6;
  optional string name = 7;
  optional string owner = 17;
  optional string road_reference = 8;
  optional string serial = 9;
  optional string site_id = 18;
}

message StationStateLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message Configuration {
  optional string wind_sensor_height_m = 1;
  optional string air_temperature_sensor_height_m = 2;
  optional string visibility_sensor_height_m = 3;
}

message Atmospheric {
  optional string air_temperature_c = 1;
  optional string dewpoint_c = 2;
  optional string humidity_percent = 3;
  optional string pressure_hpa = 4;
  optional string wind_speed_ms = 5;
  optional string wind_speed_avg_ms = 10;
  optional string wind_gust_ms = 6;
  optional string wind_direction_deg = 7;
  optional string wind_direction_avg_deg = 12;
  google.protobuf.Timestamp observed_at = 8;
  optional Quality quality = 11;
  optional string sensor_id = 9;
}

message Precipitation {
  optional PrecipitationType type = 1;
  optional PrecipitationIntensity intensity = 2;
  optional string rate_mm_h = 3;
  optional string accumulated_mm = 4;
  optional string accumulated_1h_mm = 8;
  optional string accumulated_24h_mm = 9;
  optional string snow_depth_mm = 10;
  optional string snow_rate_mm_h = 11;
  google.protobuf.Timestamp observed_at = 5;
  optional Quality quality = 7;
  optional string sensor_id = 6;
}

message Visibility {
  optional uint32 range_m = 1;
  optional VisibilitySituation situation = 2;
  google.protobuf.Timestamp observed_at = 3;
  optional Quality quality = 5;
  optional string sensor_id = 4;
}

message Pavement {
  repeated PavementSensor sensor = 1;
}

message PavementSensor {
  optional string sensor_id = 1;
  PavementSensorConfig config = 2;
  PavementSensorState state = 3;
}

message PavementSensorConfig {
  optional string lane_reference = 1;
  optional SensingMethod sensing_method = 3;
  optional string sensor_id = 2;
}

message PavementSensorState {
  google.protobuf.Timestamp observed_at = 1;
  optional string surface_temperature_c = 2;
  optional PavementCondition condition = 3;
  optional string freeze_point_c = 4;
  optional string water_depth_mm = 5;
  optional uint32 salinity_ppm = 6;
  optional string grip_coefficient = 11;
  optional string chemical_percent = 12;
  optional string chemical_factor = 13;
  optional string ice_depth_mm = 14;
  optional string subsurface_temperature_c = 7;
  optional uint32 subsurface_depth_mm = 8;
  optional string lane_reference = 9;
  optional SensingMethod sensing_method = 15;
  optional string sensor_id = 10;
}

message Radiation {
  optional string solar_radiation_wm2 = 1;
  optional string solar_radiation_hourly_avg_wm2 = 2;
  google.protobuf.Timestamp observed_at = 3;
  optional Quality quality = 5;
  optional string sensor_id = 4;
}

message Diagnostics {
  repeated DiagnosticsSensor sensor = 1;
}

message DiagnosticsSensor {
  optional string sensor_id = 1;
  DiagnosticsSensorConfig config = 2;
  DiagnosticsSensorState state = 3;
}

message DiagnosticsSensorConfig {
  optional uint32 sample_interval_s = 1;
  optional string sensor_id = 2;
}

message DiagnosticsSensorState {
  optional string type = 1;
  optional SensorHealth health = 2;
  google.protobuf.Timestamp last_observation = 3;
  google.protobuf.Timestamp last_calibration = 4;
  google.protobuf.Timestamp next_calibration = 5;
  optional uint32 sample_interval_s = 6;
  optional string sensor_id = 7;
}

message Faults {
  repeated Fault fault = 1;
}

message Fault {
  optional string category = 1;
  optional string correlates_with = 6;
  optional string description = 2;
  optional string fault_id = 3;
  google.protobuf.Timestamp first_observed = 4;
  optional FaultSeverity severity = 5;
}

