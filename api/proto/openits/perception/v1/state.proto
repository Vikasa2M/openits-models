syntax = "proto3";

package openits.perception.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/perception/v1;perceptionv1";

import "google/protobuf/timestamp.proto";
import "openits/perception/v1/types.proto";

message PerceptionSensor {
  PerceptionSensorConfig config = 1;
  PerceptionSensorState state = 2;
  Associations associations = 9;
  PerceptionSensorConfiguration configuration = 3;
  Objects objects = 4;
  PerceptionSensorZones zones = 5;
  Diagnostics diagnostics = 6;
  Incidents incidents = 7;
  IncidentReview incident_review = 10;
  Faults faults = 8;
  ZoneOccupancy zone_occupancy = 11;
}

message PerceptionSensorConfig {
  optional string elevation = 1;
  optional uint32 heading = 2;
  optional string id = 8;
  google.protobuf.Timestamp install_date = 7;
  optional string latitude = 3;
  PerceptionSensorConfigLinearReference linear_reference = 9;
  optional string longitude = 4;
  optional string maintained_by = 10;
  optional string name = 5;
  optional string owner = 11;
  optional string road_reference = 6;
  optional string site_id = 12;
}

message PerceptionSensorConfigLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message PerceptionSensorState {
  optional string elevation = 1;
  optional string firmware = 2;
  optional string firmware_build = 13;
  optional string hardware_version = 14;
  optional uint32 heading = 3;
  optional string id = 12;
  google.protobuf.Timestamp install_date = 10;
  optional string latitude = 4;
  PerceptionSensorStateLinearReference linear_reference = 15;
  optional string longitude = 5;
  optional string maintained_by = 16;
  optional string make = 6;
  optional string model = 7;
  optional string name = 8;
  optional string owner = 17;
  optional string road_reference = 9;
  optional string serial = 11;
  optional string site_id = 18;
}

message PerceptionSensorStateLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message Associations {
  repeated AssociatedDevice associated_device = 1;
}

message AssociatedDevice {
  optional string device_id = 1;
  optional string role = 2;
  optional string note = 3;
}

message PerceptionSensorConfiguration {
  optional uint32 data_interval_s = 1;
  repeated PerceptionSensorConfigurationZone zone = 2;
}

message PerceptionSensorConfigurationZone {
  optional string zone_id = 1;
  optional string name = 2;
  optional string function = 3;
  optional uint32 legal_heading = 4;
  optional uint32 dwell_s = 5;
  optional uint32 persistence_s = 6;
  optional uint32 min_confidence = 7;
  optional string congestion_speed_threshold_kmh = 8;
  optional string congestion_density_threshold = 9;
  repeated Vertex vertex = 10;
}

message Vertex {
  optional uint32 vertex_index = 1;
  optional string latitude = 2;
  optional string longitude = 3;
}

message Objects {
  optional uint32 track_count = 1;
  optional uint32 track_epoch = 3;
  repeated Track track = 2;
}

message Track {
  optional uint32 track_id = 1;
  optional Lifecycle lifecycle = 10;
  optional string class = 2;
  optional uint32 class_confidence = 3;
  optional string speed_kmh = 4;
  google.protobuf.Timestamp observed_at = 5;
  optional string elevation = 6;
  optional uint32 heading = 7;
  optional string latitude = 8;
  optional string longitude = 9;
}

message PerceptionSensorZones {
  repeated PerceptionSensorZonesZone zone = 1;
}

message PerceptionSensorZonesZone {
  reserved 2, 3;
  reserved "occupancy_count", "presence";
  optional string zone_id = 1;
  optional string average_speed_kmh = 4;
}

message Diagnostics {
  optional uint32 points_per_second = 8;
  optional uint32 blockage_percent = 9;
  optional string internal_temperature_c = 6;
  optional string pose_drift_deg = 10;
  optional uint64 uptime_s = 7;
}

message Incidents {
  repeated Incident incident = 1;
}

message Incident {
  optional string incident_id = 1;
  optional string zone_id = 2;
  optional string type = 3;
  optional IncidentSeverity severity = 4;
  optional uint32 track_id = 8;
  optional uint32 track_epoch = 12;
  optional string object_class = 9;
  optional string speed_kmh = 10;
  optional uint32 confidence = 11;
  google.protobuf.Timestamp first_observed = 5;
  optional IncidentDisposition disposition = 13;
  optional string latitude = 6;
  optional string longitude = 7;
}

message IncidentReview {
  repeated Review review = 1;
}

message Review {
  optional string incident_id = 1;
  optional IncidentDisposition disposition = 2;
  optional string reviewed_by = 3;
}

message Faults {
  repeated Fault fault = 1;
}

message Fault {
  optional string category = 1;
  optional string correlates_with = 6;
  optional string description = 2;
  optional string fault_id = 3;
  google.protobuf.Timestamp first_observed = 4;
  optional FaultSeverity severity = 5;
}

message ZoneOccupancy {
  ZoneOccupancyConfiguration configuration = 1;
  ZoneOccupancyZones zones = 2;
}

message ZoneOccupancyConfiguration {
  repeated ZoneOccupancyConfigurationZone zone = 1;
}

message ZoneOccupancyConfigurationZone {
  reserved 3;
  reserved "capacity";
  optional string zone_id = 1;
  optional string name = 2;
  optional string sensing_method = 4;
  optional bool classifies = 5;
}

message ZoneOccupancyZones {
  repeated ZoneOccupancyZonesZone zone = 1;
}

message ZoneOccupancyZonesZone {
  optional string zone_id = 1;
  google.protobuf.Timestamp measured_at = 6;
  optional uint32 occupancy_count = 3;
  google.protobuf.Timestamp occupied_since = 4;
  optional bool presence = 2;
  optional uint32 presence_confidence = 5;
  repeated PresentClass present_class = 7;
}

message PresentClass {
  optional string class = 1;
  optional uint32 count = 2;
  optional uint32 classification_confidence = 3;
}

