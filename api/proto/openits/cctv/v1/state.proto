syntax = "proto3";

package openits.cctv.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/cctv/v1;cctvv1";

import "google/protobuf/timestamp.proto";
import "openits/cctv/v1/types.proto";

message Camera {
  CameraConfig config = 1;
  CameraState state = 2;
  Mounting mounting = 3;
  Ptz ptz = 4;
  Lens lens = 9;
  PrivacyMasks privacy_masks = 10;
  Streams streams = 5;
  Environment environment = 6;
  Faults faults = 7;
  Control control = 8;
}

message CameraConfig {
  optional string elevation = 1;
  optional uint32 heading = 2;
  optional string id = 3;
  google.protobuf.Timestamp install_date = 8;
  optional string latitude = 4;
  CameraConfigLinearReference linear_reference = 9;
  optional string longitude = 5;
  optional string maintained_by = 10;
  optional string name = 6;
  optional string owner = 11;
  optional string road_reference = 7;
  optional string site_id = 12;
}

message CameraConfigLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message CameraState {
  optional OperationalStatus operational_status = 14;
  optional string elevation = 1;
  optional string firmware = 2;
  optional string firmware_build = 3;
  optional string hardware_version = 4;
  optional uint32 heading = 5;
  optional string id = 6;
  google.protobuf.Timestamp install_date = 15;
  optional string latitude = 7;
  CameraStateLinearReference linear_reference = 16;
  optional string longitude = 8;
  optional string maintained_by = 17;
  optional string make = 9;
  optional string model = 10;
  optional string name = 11;
  optional string owner = 18;
  optional string road_reference = 12;
  optional string serial = 13;
  optional string site_id = 19;
}

message CameraStateLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message Mounting {
  reserved 3;
  reserved "co_located_device";
  optional MountingStructure structure = 1;
  optional string height_m = 2;
  optional uint32 pan_reference_offset_deg = 4;
  repeated AssociatedDevice associated_device = 5;
}

message AssociatedDevice {
  optional string device_id = 1;
  optional string role = 2;
  optional string note = 3;
}

message Ptz {
  Capabilities capabilities = 1;
  PtzConfig config = 5;
  PtzState state = 2;
  Presets presets = 3;
  Tours tours = 4;
}

message Capabilities {
  optional bool ptz_capable = 1;
  optional uint32 max_presets = 2;
  optional bool pan_continuous = 3;
}

message PtzConfig {
  PtzConfigAbsolute absolute = 1;
  PtzConfigVelocity velocity = 2;
}

message PtzConfigAbsolute {
  optional string pan_degrees = 1;
  optional string tilt_degrees = 2;
  optional uint32 zoom_percent = 3;
}

message PtzConfigVelocity {
  optional int32 pan_speed = 1;
  optional int32 tilt_speed = 2;
  optional int32 zoom_speed = 3;
}

message PtzState {
  optional string pan_degrees = 1;
  optional string tilt_degrees = 2;
  optional uint32 zoom_percent = 3;
  optional bool moving = 4;
  optional PtzMoveMode move_mode = 5;
}

message Presets {
  repeated Preset preset = 1;
  optional uint32 recall = 2;
  PresetsState state = 3;
}

message Preset {
  optional uint32 preset_id = 1;
  optional string name = 2;
  optional string pan_degrees = 3;
  optional string tilt_degrees = 4;
  optional uint32 zoom_percent = 5;
}

message PresetsState {
  optional uint32 active_preset = 1;
}

message Tours {
  repeated Tour tour = 1;
  optional uint32 run = 2;
  ToursState state = 3;
}

message Tour {
  optional uint32 tour_id = 1;
  optional string name = 2;
  repeated Stop stop = 3;
}

message Stop {
  optional uint32 sequence = 1;
  optional uint32 preset_id = 2;
  optional uint32 dwell_seconds = 3;
}

message ToursState {
  optional uint32 active_tour = 1;
  optional TourRunState run_state = 2;
  optional uint32 current_stop = 3;
}

message Lens {
  LensConfig config = 1;
  LensState state = 2;
}

message LensConfig {
  optional LensMode focus_mode = 1;
  optional uint32 focus_position = 2;
  optional LensMode iris_mode = 3;
  optional uint32 iris_position = 4;
}

message LensState {
  optional LensMode focus_mode = 1;
  optional uint32 focus_position = 2;
  optional LensMode iris_mode = 3;
  optional uint32 iris_position = 4;
}

message PrivacyMasks {
  repeated Mask mask = 1;
}

message Mask {
  optional uint32 mask_id = 1;
  optional string name = 2;
  optional bool enabled = 3;
}

message Streams {
  repeated Stream stream = 1;
}

message Stream {
  optional uint32 stream_id = 1;
  StreamConfig config = 2;
  StreamState state = 3;
}

message StreamConfig {
  optional VideoCodec codec = 1;
  optional uint32 target_bitrate_kbps = 2;
}

message StreamState {
  optional uint32 width_px = 1;
  optional uint32 height_px = 2;
  optional VideoCodec codec = 3;
  optional uint32 bitrate_kbps = 4;
  optional string frame_rate = 5;
  optional StreamHealth health = 6;
  optional string uri = 7;
}

message Environment {
  EnvironmentConfig config = 1;
  EnvironmentState state = 2;
}

message EnvironmentConfig {
  optional bool wiper = 1;
  optional bool washer = 2;
  optional uint32 washer_spray_duration_s = 4;
  optional HeaterMode heater_mode = 3;
}

message EnvironmentState {
  optional string enclosure_temp_c = 1;
  optional bool wiper_active = 2;
  optional bool heater_active = 3;
  optional bool blower_active = 4;
}

message Faults {
  repeated Fault fault = 1;
}

message Fault {
  optional string category = 1;
  optional string correlates_with = 6;
  optional string description = 2;
  optional string fault_id = 3;
  google.protobuf.Timestamp first_observed = 4;
  optional FaultSeverity severity = 5;
}

message Control {
  ControlConfig config = 1;
  ControlState state = 2;
}

message ControlConfig {
  optional string control_mode = 1;
  ControlConfigHolder holder = 2;
}

message ControlConfigHolder {
  string requested_by = 1;
  optional uint32 priority = 2;
  optional uint32 lockout_timeout_s = 3;
}

message ControlState {
  optional string control_mode = 1;
  ControlStateHolder holder = 2;
}

message ControlStateHolder {
  optional string current_holder = 1;
  optional uint32 held_priority = 2;
  google.protobuf.Timestamp held_since = 3;
  google.protobuf.Timestamp expires_at = 4;
}

