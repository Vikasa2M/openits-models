syntax = "proto3";

package openits.rsu.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/rsu/v1;rsuv1";

import "google/protobuf/timestamp.proto";
import "openits/rsu/v1/types.proto";

message Rsu {
  reserved 9, 10;
  reserved "configured_time_source", "mode";
  RsuConfig config = 1;
  RsuState state = 2;
  Operating operating = 12;
  Gnss gnss = 11;
  StoreForward store_forward = 3;
  Diagnostics diagnostics = 4;
  System system = 5;
  Faults faults = 13;
  Channels channels = 6;
  Messages messages = 7;
  RsuSecurity security = 8;
}

message RsuConfig {
  optional string elevation = 1;
  optional uint32 heading = 2;
  optional string id = 3;
  google.protobuf.Timestamp install_date = 8;
  optional string latitude = 4;
  RsuConfigLinearReference linear_reference = 9;
  optional string longitude = 5;
  optional string maintained_by = 10;
  optional string name = 6;
  optional string owner = 11;
  optional string road_reference = 7;
  optional string site_id = 12;
}

message RsuConfigLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message RsuState {
  optional string elevation = 1;
  optional string firmware = 8;
  optional string firmware_build = 9;
  optional string hardware_version = 10;
  optional uint32 heading = 2;
  optional string id = 3;
  google.protobuf.Timestamp install_date = 14;
  optional string latitude = 4;
  RsuStateLinearReference linear_reference = 15;
  optional string longitude = 5;
  optional string maintained_by = 16;
  optional string make = 11;
  optional string model = 12;
  optional string name = 6;
  optional string owner = 17;
  optional string road_reference = 7;
  optional string serial = 13;
  optional string site_id = 18;
}

message RsuStateLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message Operating {
  OperatingConfig config = 1;
  OperatingState state = 2;
}

message OperatingConfig {
  optional string configured_time_source = 1;
  optional string mode = 2;
}

message OperatingState {
  optional string active_mode = 1;
  optional bool time_valid = 2;
  optional bool holdover = 3;
}

message Gnss {
  SurveyedPosition surveyed_position = 1;
}

message SurveyedPosition {
  optional string latitude = 1;
  optional string longitude = 2;
}

message StoreForward {
  StoreForwardConfig config = 1;
  StoreForwardState state = 2;
}

message StoreForwardConfig {
  optional bool enabled = 1;
  optional uint32 max_messages = 2;
  optional uint32 max_age = 3;
  optional bool forward_on_connect = 4;
}

message StoreForwardState {
  optional uint32 stored_messages = 1;
  optional uint32 storage_used_percent = 2;
  optional uint64 messages_forwarded_today = 3;
  optional uint32 oldest_message_age = 4;
}

message Diagnostics {
  reserved 22, 32, 33, 34;
  reserved "cellular", "time_valid", "holdover", "active_mode";
  Radio radio = 15;
  SpatSync spat_sync = 16;
  Resources resources = 17;
  optional GpsFixStatus gps_status = 18;
  optional uint32 satellites_visible = 19;
  optional string hdop = 1;
  optional bool pps_present = 2;
  optional string position_deviation_m = 3;
  optional string time_source = 20;
  optional uint32 time_accuracy_us = 21;
  BackhaulCellular backhaul_cellular = 4;
  optional string config_hash = 27;
  optional string last_restart_reason = 28;
  google.protobuf.Timestamp last_restart_time = 29;
  Logs logs = 23;
  repeated Process process = 24;
  optional uint32 restart_count = 30;
  repeated TemperatureSensor temperature_sensor = 25;
  optional uint64 uptime_seconds = 31;
  VehicleAnalytics vehicle_analytics = 26;
}

message Radio {
  reserved 12;
  reserved "collision_count";
  optional int32 rssi_dbm = 1;
  optional int32 noise_floor_dbm = 2;
  optional int32 snr_db = 3;
  optional uint64 crc_errors = 11;
  optional bool operational = 13;
  optional string fault_type = 14;
  google.protobuf.Timestamp last_successful_tx = 16;
}

message SpatSync {
  reserved 1;
  reserved "asc_connected";
  optional uint32 asc_poll_interval_ms = 2;
  google.protobuf.Timestamp last_asc_update = 3;
  optional uint32 phase_mismatch_count = 4;
  optional uint32 timing_mismatch_count = 5;
  optional uint64 total_spat_generated = 6;
  optional uint32 sync_quality_pct = 7;
  optional uint32 avg_data_age_ms = 8;
  optional uint32 min_yellow_violation = 9;
  optional uint32 max_green_exceeded = 10;
  optional uint32 phase_gap_errors = 11;
}

message Resources {
  Cpu cpu = 1;
  Disk disk = 2;
  Memory memory = 3;
}

message Cpu {
  optional uint32 usage_pct = 1;
  optional string temperature_c = 2;
  optional string load_1min = 3;
  optional string load_5min = 4;
  optional string load_15min = 5;
  optional bool alarm = 6;
}

message Disk {
  optional uint64 total_kb = 1;
  optional uint64 used_kb = 2;
  optional uint64 free_kb = 3;
  optional uint32 usage_pct = 4;
  optional bool alarm = 5;
}

message Memory {
  optional uint64 total_kb = 1;
  optional uint64 used_kb = 2;
  optional uint64 free_kb = 3;
  optional uint32 usage_pct = 4;
  optional bool alarm = 5;
}

message BackhaulCellular {
  optional bool operational = 1;
  optional string operator_name = 2;
  optional SignalQuality signal_quality = 3;
  optional int32 rsrp_dbm = 4;
  optional int32 rsrq_db = 5;
  optional int32 sinr_db = 6;
  optional string lte_band = 7;
  optional string nr_band = 8;
  optional uint64 data_usage_bytes = 9;
  optional bool roaming = 10;
}

message Logs {
  optional uint64 total_entries = 1;
  Errors errors = 2;
  Warnings warnings = 3;
  Critical critical = 4;
  optional string most_recent_error = 5;
  google.protobuf.Timestamp most_recent_error_time = 6;
  optional uint32 storage_used_pct = 7;
}

message Errors {
  optional uint64 count_1h = 1;
  optional uint64 count_24h = 2;
}

message Warnings {
  optional uint64 count_1h = 1;
  optional uint64 count_24h = 2;
}

message Critical {
  optional uint64 count_1h = 1;
  optional uint64 count_24h = 2;
}

message Process {
  optional string name = 1;
  optional uint32 pid = 2;
  optional string state = 3;
  optional uint32 cpu_usage_pct = 4;
  optional uint64 memory_kb = 5;
  optional uint64 uptime_seconds = 6;
  optional uint32 restart_count = 7;
  google.protobuf.Timestamp last_restart = 8;
  optional bool required = 9;
}

message TemperatureSensor {
  optional uint32 id = 1;
  optional string name = 2;
  optional string temperature_c = 3;
  optional string status = 4;
  optional string threshold_high_c = 5;
  optional string threshold_low_c = 6;
}

message VehicleAnalytics {
  SampleBasis sample_basis = 5;
  Counts counts = 1;
  SpeedMetrics speed_metrics = 2;
  VehicleClassBreakdown vehicle_class_breakdown = 3;
  repeated Approach approach = 4;
}

message SampleBasis {
  optional StatsWindowType window_type = 1;
  optional uint32 stats_window_seconds = 2;
  optional uint32 sample_count = 3;
  optional string penetration_estimate_pct = 4;
  google.protobuf.Timestamp computed_at = 5;
}

message Counts {
  optional CountBasis count_basis = 4;
  optional uint32 vehicles_1min = 1;
  optional uint32 vehicles_1hr = 2;
  optional uint32 vehicles_24hr = 3;
}

message SpeedMetrics {
  optional string average_kmh = 1;
  optional string median_kmh = 2;
  optional string percentile_85_kmh = 3;
  optional string percentile_95_kmh = 4;
}

message VehicleClassBreakdown {
  optional uint32 passenger_pct = 1;
  optional uint32 truck_pct = 2;
  optional uint32 emergency_pct = 3;
  optional uint32 transit_pct = 4;
}

message Approach {
  optional uint32 number = 1;
  optional uint32 vehicles_1min = 2;
  optional string average_speed_kmh = 3;
  optional uint32 queue_vehicles = 4;
}

message System {
  repeated CommLink comm_link = 1;
}

message CommLink {
  optional uint64 bytes_received = 1;
  optional uint64 bytes_sent = 2;
  optional uint32 error_count = 3;
  google.protobuf.Timestamp last_successful = 4;
  optional uint32 latency_ms = 5;
  optional uint32 link_id = 6;
  optional string link_type = 7;
  optional bool operational = 8;
  optional string remote_address = 9;
}

message Faults {
  repeated Fault fault = 1;
}

message Fault {
  optional string category = 1;
  optional string correlates_with = 2;
  optional string description = 3;
  optional string fault_id = 4;
  google.protobuf.Timestamp first_observed = 5;
  optional FaultSeverity severity = 6;
}

message Channels {
  reserved 2;
  reserved "radio_type";
  optional string reported_radio_tech = 3;
  repeated Channel channel = 1;
}

message Channel {
  reserved 8;
  reserved "dsrc_channel_number";
  optional string channel_id = 6;
  string radio_tech = 7;
  ChannelConfig config = 9;
  ChannelState state = 10;
}

message ChannelConfig {
  optional uint32 dsrc_channel_number = 7;
  optional bool enabled = 1;
  optional string mode = 2;
  optional int32 tx_power = 3;
  optional string antenna_gain_dbi = 8;
  repeated string message_types = 4;
  optional bool primary = 5;
  Dcc dcc = 6;
}

message Dcc {
  optional DccPolicy policy = 1;
  optional uint32 cbr_target_percent = 2;
}

message ChannelState {
  optional bool operational = 1;
  optional string radio_tech = 15;
  optional uint64 packets_tx = 2;
  optional uint64 packets_rx = 3;
  optional uint64 bytes_tx = 4;
  optional uint64 bytes_rx = 5;
  optional uint32 tx_errors = 6;
  optional uint32 rx_errors = 7;
  optional uint32 channel_busy_ratio = 8;
  optional int32 tx_power_dbm = 9;
  optional string fault_type = 10;
  optional uint32 tx_queue_depth = 11;
  optional uint64 tx_failures = 12;
  optional uint64 rx_decode_errors = 13;
  optional uint64 security_failures = 14;
}

message Messages {
  Spat spat = 2;
  Map map = 3;
  Tim tim = 4;
  Bsm bsm = 5;
  Psm psm = 6;
  Rtcm rtcm = 1;
  SrmSsm srm_ssm = 7;
  MessageStats message_stats = 8;
  MessageErrors message_errors = 9;
}

message Spat {
  SpatConfig config = 1;
  SpatState state = 2;
}

message SpatConfig {
  optional bool enabled = 1;
  optional uint32 broadcast_interval = 2;
  optional uint32 max_data_age_ms = 6;
  optional string source_asc = 3;
  optional BroadcastSourceMode source_mode = 4;
  SpatConfigIngest ingest = 8;
  repeated SpatConfigIntersection intersection = 7;
  optional bool include_timing_prediction = 5;
  optional uint32 psid = 9;
}

message SpatConfigIngest {
  optional IngestTransport transport = 1;
  optional string address = 2;
  optional uint32 port = 3;
  optional uint32 psid = 4;
}

message SpatConfigIntersection {
  optional uint32 id = 1;
  optional uint32 region = 2;
}

message SpatState {
  optional bool broadcasting = 1;
  optional uint64 broadcast_count = 2;
  google.protobuf.Timestamp last_broadcast = 3;
  optional bool asc_connected = 4;
  optional bool halted_stale = 5;
}

message Map {
  MapConfig config = 1;
  MapState state = 2;
}

message MapConfig {
  optional bool enabled = 1;
  optional uint32 broadcast_interval = 2;
  repeated MapConfigIntersection intersection = 4;
  optional uint32 geometry_version = 3;
  optional uint32 psid = 5;
  optional BroadcastSourceMode source_mode = 6;
  MapConfigIngest ingest = 7;
  optional uint32 max_data_age_ms = 8;
}

message MapConfigIntersection {
  optional uint32 id = 1;
  optional uint32 region = 2;
}

message MapConfigIngest {
  optional IngestTransport transport = 1;
  optional string address = 2;
  optional uint32 port = 3;
  optional uint32 psid = 4;
}

message MapState {
  optional bool broadcasting = 1;
  optional uint64 broadcast_count = 2;
  repeated MapStateIntersection intersection = 6;
  optional uint32 lane_count = 4;
  optional uint32 approach_count = 5;
}

message MapStateIntersection {
  optional uint32 id = 1;
  optional uint32 region = 2;
}

message Tim {
  TimConfig config = 1;
  Active active = 2;
}

message TimConfig {
  optional bool enabled = 1;
  optional uint32 max_active_messages = 2;
  optional bool suppress_expired = 3;
}

message Active {
  repeated Message message = 10;
}

message Message {
  optional string id = 1;
  MessageConfig config = 2;
  MessageState state = 3;
}

message MessageConfig {
  reserved 5, 6;
  reserved "end_time", "itis_codes";
  optional string name = 1;
  optional uint32 psid = 10;
  optional bool enabled = 2;
  optional uint32 priority = 3;
  google.protobuf.Timestamp start_time = 4;
  optional uint32 duration_minutes = 11;
  repeated uint32 itis_code = 9;
  optional string text = 7;
  Region region = 8;
}

message Region {
  optional uint32 radius = 1;
  optional uint32 direction = 2;
  optional uint32 direction_tolerance = 3;
  optional string elevation = 4;
  optional uint32 heading = 5;
  optional string latitude = 6;
  optional string longitude = 7;
}

message MessageState {
  optional uint64 broadcast_count = 1;
  google.protobuf.Timestamp last_broadcast = 2;
  optional bool broadcasting = 3;
  optional bool expired = 4;
}

message Bsm {
  BsmConfig config = 1;
  BsmState state = 2;
}

message BsmConfig {
  optional bool receive_enabled = 1;
  optional uint32 psid = 7;
  optional bool forward_enabled = 2;
  optional string forward_destination = 3;
  optional uint32 forward_port = 4;
  optional ForwardProtocol forward_protocol = 8;
  optional ForwardFormat forward_format = 9;
  optional bool strip_path_history = 10;
  optional bool filter_by_region = 5;
  optional uint32 region_radius = 6;
}

message BsmState {
  optional uint64 received_count = 1;
  optional uint64 forwarded_count = 2;
  optional uint32 unique_vehicles_1min = 3;
  optional uint32 unique_vehicles_1hr = 4;
  optional string average_speed = 5;
  google.protobuf.Timestamp last_received = 6;
}

message Psm {
  PsmConfig config = 1;
  PsmState state = 2;
  BroadcastConfig broadcast_config = 3;
  BroadcastState broadcast_state = 4;
}

message PsmConfig {
  optional bool enabled = 1;
  optional bool alert_asc = 2;
  optional uint32 psid = 3;
}

message PsmState {
  optional uint64 received_count = 1;
  optional uint32 pedestrians_detected_1min = 2;
  optional uint32 pedestrians_detected_1hr = 3;
  google.protobuf.Timestamp last_received = 4;
  optional uint64 invalid_count = 5;
}

message BroadcastConfig {
  optional bool enabled = 1;
  optional string source = 2;
  optional uint32 broadcast_interval = 3;
  optional uint32 psid = 4;
}

message BroadcastState {
  optional bool broadcasting = 1;
  optional uint64 broadcast_count = 2;
  google.protobuf.Timestamp last_broadcast = 3;
}

message Rtcm {
  RtcmConfig config = 1;
  RtcmState state = 2;
}

message RtcmConfig {
  optional bool enabled = 1;
  optional string source_url = 2;
  repeated uint32 message_set = 3;
  optional uint32 broadcast_interval = 4;
  optional uint32 psid = 5;
}

message RtcmState {
  optional bool broadcasting = 1;
  optional uint64 broadcast_count = 2;
  google.protobuf.Timestamp last_broadcast = 3;
}

message SrmSsm {
  SrmSsmConfig config = 1;
  SrmSsmState state = 2;
  ActiveRequests active_requests = 3;
  Decisions decisions = 4;
}

message SrmSsmConfig {
  optional uint32 psid = 9;
  optional bool srm_receive_enabled = 1;
  optional bool ssm_broadcast_enabled = 2;
  optional bool forward_to_asc = 3;
  optional string asc_device = 4;
  optional GrantAuthority grant_authority = 7;
  optional bool evp_auto_grant = 8;
  optional bool auto_approve_tsp = 5;
  optional uint32 max_active_requests = 6;
}

message SrmSsmState {
  optional uint64 srm_received = 1;
  optional uint64 ssm_broadcast = 2;
  optional uint32 active_requests = 3;
  optional uint64 approved_requests = 4;
  optional uint64 denied_requests = 5;
}

message ActiveRequests {
  repeated Request request = 1;
}

message Request {
  optional string id = 1;
  optional string vehicle_id = 2;
  optional string request_type = 3;
  optional uint32 approach = 4;
  optional uint32 eta_seconds = 5;
  google.protobuf.Timestamp received_at = 6;
  optional SrmRequestStatus status = 7;
  optional uint32 priority = 8;
  optional string vehicle_class = 9;
  optional DecisionAuthority decision_authority = 10;
  optional string denial_reason = 11;
}

message Decisions {
  repeated Decision decision = 1;
}

message Decision {
  optional string request_id = 1;
  PriorityDecisionAction action = 2;
  optional string reason = 3;
}

message MessageStats {
  repeated PerMessageType per_message_type = 1;
}

message PerMessageType {
  reserved 5, 6;
  reserved "total_sent", "total_received";
  optional string message_type = 1;
  optional uint32 psid = 13;
  optional uint32 queue_depth = 2;
  optional uint64 tx_count = 3;
  optional uint64 rx_count = 4;
  optional uint64 success = 7;
  optional uint64 invalid = 8;
  optional uint32 avg_latency_ms = 9;
  optional uint32 rate_per_sec = 10;
  optional uint64 encoding_errors = 11;
  optional uint64 decoding_errors = 12;
}

message MessageErrors {
  MessageErrorsSecurity security = 1;
  Drops drops = 2;
  optional uint64 asc_data_errors = 3;
}

message MessageErrorsSecurity {
  optional uint64 sign_failures = 1;
  optional uint64 verify_failures = 2;
  optional uint64 cert_errors = 3;
}

message Drops {
  optional uint64 queue = 1;
  optional uint64 timeout = 2;
  optional uint64 congestion = 3;
}

message RsuSecurity {
  RsuSecurityConfig config = 1;
  RsuSecurityState state = 2;
  Certificates certificates = 3;
}

message RsuSecurityConfig {
  optional bool security_enabled = 1;
  optional string scms_url = 2;
  optional bool auto_renewal = 3;
  optional uint32 renewal_days_before_expiry = 4;
  optional bool permit_unsigned_broadcast = 6;
  RsuSecurityConfigMisbehaviorReporting misbehavior_reporting = 5;
}

message RsuSecurityConfigMisbehaviorReporting {
  optional bool enabled = 1;
  optional string authority_url = 2;
  optional uint32 min_reports_to_send = 3;
}

message RsuSecurityState {
  optional bool scms_connected = 1;
  google.protobuf.Timestamp last_scms_contact = 2;
  optional EnrollmentStatus enrollment_status = 3;
  optional uint32 pseudonym_certs_available = 4;
  optional uint32 pseudonym_certs_used = 5;
  optional uint32 app_certs_available = 6;
  optional int32 days_to_app_cert_expiry = 20;
  optional bool app_cert_renewal_active = 21;
  optional int32 days_to_enrollment_expiry = 7;
  optional int32 days_to_pseudonym_expiry = 8;
  google.protobuf.Timestamp earliest_cert_expiry = 9;
  google.protobuf.Timestamp last_cert_download = 10;
  optional uint64 certs_downloaded_total = 11;
  optional uint64 cert_download_failures = 12;
  optional uint32 cert_download_queue = 13;
  google.protobuf.Timestamp last_crl_update = 14;
  optional uint32 crl_entries = 15;
  google.protobuf.Timestamp next_crl_due = 18;
  optional bool crl_overdue = 19;
  optional string lpf_version = 23;
  optional string lccf_version = 24;
  google.protobuf.Timestamp policy_files_last_updated = 25;
  optional uint64 revocation_checks = 16;
  optional uint64 revocation_rejections = 17;
  RsuSecurityStateMisbehaviorReporting misbehavior_reporting = 22;
}

message RsuSecurityStateMisbehaviorReporting {
  optional uint64 reports_generated = 1;
  optional uint64 reports_sent = 2;
  optional uint32 reports_pending = 3;
  google.protobuf.Timestamp last_report_sent = 4;
}

message Certificates {
  repeated Certificate certificate = 1;
}

message Certificate {
  optional string id = 1;
  CertificateState state = 2;
}

message CertificateState {
  optional CertificateType type = 1;
  optional string status = 2;
  google.protobuf.Timestamp valid_from = 3;
  google.protobuf.Timestamp valid_until = 4;
  optional int32 days_until_expiry = 5;
  repeated Permissions permissions = 6;
  GeographicValidity geographic_validity = 7;
}

message Permissions {
  optional uint32 psid = 1;
  optional string ssp = 2;
}

message GeographicValidity {
  optional GeographicRegionType region_type = 1;
  optional uint32 identified_region_id = 2;
  CircularRegion circular_region = 3;
}

message CircularRegion {
  optional uint32 radius_m = 1;
  optional string latitude = 2;
  optional string longitude = 3;
}

