syntax = "proto3";

package openits.ramp_metering.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/ramp_metering/v1;rampmeteringv1";

import "google/protobuf/timestamp.proto";
import "openits/ramp_metering/v1/types.proto";

message RampMeter {
  RampMeterConfig config = 1;
  RampMeterState state = 2;
  Control control = 3;
  Sequencing sequencing = 8;
  AdvanceWarningSign advance_warning_sign = 9;
  Plans plans = 4;
  Schedule schedule = 10;
  TrafficResponsive traffic_responsive = 11;
  Lanes lanes = 5;
  MainlineDetectors mainline_detectors = 12;
  Diagnostics diagnostics = 6;
  Faults faults = 7;
}

message RampMeterConfig {
  optional string elevation = 5;
  optional uint32 heading = 6;
  optional string id = 7;
  google.protobuf.Timestamp install_date = 3;
  optional string latitude = 1;
  RampMeterConfigLinearReference linear_reference = 4;
  optional string longitude = 2;
  optional string maintained_by = 10;
  optional string name = 8;
  optional string owner = 11;
  optional string road_reference = 9;
  optional string site_id = 12;
}

message RampMeterConfigLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message RampMeterState {
  optional string elevation = 9;
  optional string firmware = 1;
  optional string firmware_build = 14;
  optional string hardware_version = 15;
  optional uint32 heading = 10;
  optional string id = 11;
  google.protobuf.Timestamp install_date = 5;
  optional string latitude = 2;
  RampMeterStateLinearReference linear_reference = 7;
  optional string longitude = 3;
  optional string maintained_by = 16;
  optional string make = 4;
  optional string model = 6;
  optional string name = 12;
  optional string owner = 17;
  optional string road_reference = 13;
  optional string serial = 8;
  optional string site_id = 18;
}

message RampMeterStateLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message Control {
  ControlConfig config = 1;
  ControlState state = 2;
}

message ControlConfig {
  optional uint32 active_plan_id = 1;
  optional string command_source = 4;
  optional uint32 manual_release_rate_vph = 2;
  optional string mode = 3;
  optional NonMeteringDisplay non_metering_display = 10;
}

message ControlState {
  optional uint32 current_release_rate_vph = 1;
  google.protobuf.Timestamp last_mode_change = 2;
  optional uint32 queue_length_current_vehicles = 3;
  optional bool queue_override_active = 4;
  optional uint32 active_plan_id = 5;
  optional string command_source = 8;
  optional uint32 manual_release_rate_vph = 6;
  optional string mode = 7;
  optional NonMeteringDisplay non_metering_display = 18;
}

message Sequencing {
  SequencingConfig config = 1;
  SequencingState state = 2;
}

message SequencingConfig {
  optional uint32 advance_warning_duration = 1;
  optional uint32 startup_steady_green_duration = 2;
  optional bool shutdown_flush_enabled = 3;
  optional uint32 shutdown_flush_max_duration = 4;
}

message SequencingState {
  optional SequencePhase sequence_phase = 1;
}

message AdvanceWarningSign {
  AdvanceWarningSignConfig config = 1;
  AdvanceWarningSignState state = 2;
}

message AdvanceWarningSignConfig {
  optional bool enabled = 1;
  optional AwsFaultAction aws_fault_action = 2;
}

message AdvanceWarningSignState {
  optional LampStatus lamp_status = 1;
  optional bool aws_fault_while_metering = 2;
}

message Plans {
  repeated Plan plan = 1;
}

message Plan {
  optional uint32 plan_id = 1;
  optional string name = 2;
  optional uint32 release_rate_vph = 3;
  optional string headway_s = 4;
  optional uint32 vehicles_per_green = 7;
  optional uint32 queue_override_threshold_vehicles = 5;
  optional uint32 queue_override_clear_threshold_vehicles = 8;
  optional uint32 queue_override_rate_vph = 9;
  optional uint32 queue_override_occupancy_threshold_pct = 10;
  optional uint32 queue_override_occupancy_clear_threshold_pct = 11;
  optional uint32 queue_override_persistence_s = 12;
  PhaseTiming phase_timing = 6;
}

message PhaseTiming {
  optional string max_green = 1;
  optional string min_green = 2;
  optional string passage = 3;
  optional string red_clear = 4;
  optional string yellow_change = 5;
}

message Schedule {
  repeated DayPlan day_plan = 1;
  repeated ScheduleEntry schedule_entry = 2;
  ScheduleState state = 3;
}

message DayPlan {
  optional uint32 day_plan_id = 1;
  optional string name = 2;
  repeated Action action = 3;
}

message Action {
  optional string start_time = 1;
  optional uint32 plan_id = 2;
}

message ScheduleEntry {
  optional uint32 schedule_id = 1;
  optional uint32 day_plan = 5;
  repeated uint32 days_of_month = 4;
  repeated DayOfWeek days_of_week = 3;
  repeated Month months = 2;
}

message ScheduleState {
  optional uint32 active_day_plan_id = 1;
  google.protobuf.Timestamp next_action_at = 2;
}

message TrafficResponsive {
  TrafficResponsiveConfig config = 1;
  TrafficResponsiveState state = 2;
}

message TrafficResponsiveConfig {
  optional string algorithm = 1;
  repeated Band band = 2;
}

message Band {
  optional uint32 band_id = 1;
  optional uint32 min_occupancy_pct = 2;
  optional uint32 max_occupancy_pct = 3;
  optional uint32 min_flow_vph = 4;
  optional uint32 max_flow_vph = 5;
  optional uint32 plan_id = 6;
}

message TrafficResponsiveState {
  optional uint32 active_band_id = 1;
}

message Lanes {
  reserved 2;
  reserved "release_coordination";
  LanesConfig config = 3;
  LanesState state = 4;
  repeated Lane lane = 1;
}

message LanesConfig {
  optional ReleaseCoordination release_coordination = 1;
}

message LanesState {
  optional ReleaseCoordination release_coordination = 1;
}

message Lane {
  optional string lane_id = 1;
  LaneConfig config = 15;
  LaneState state = 16;
  repeated LaneDetector detector = 17;
}

message LaneConfig {
  optional bool bypass = 1;
  optional BypassOperation bypass_operation = 6;
  optional string lane_id = 2;
  optional uint32 max_release_rate_vph = 3;
  optional uint32 min_release_rate_vph = 4;
  optional uint32 vehicles_per_green = 5;
}

message LaneState {
  reserved 1;
  reserved "green_active";
  optional HeadState head_state = 5;
  optional uint32 current_release_rate_vph = 6;
  google.protobuf.Timestamp last_release = 2;
  optional bool bypass = 3;
  optional BypassOperation bypass_operation = 10;
  optional string lane_id = 4;
  optional uint32 max_release_rate_vph = 7;
  optional uint32 min_release_rate_vph = 8;
  optional uint32 vehicles_per_green = 9;
}

message LaneDetector {
  optional string detector_id = 1;
  LaneDetectorConfig config = 2;
  LaneDetectorState state = 3;
}

message LaneDetectorConfig {
  optional string detector_id = 1;
  optional DetectorRole role = 2;
}

message LaneDetectorState {
  optional bool active = 1;
  optional uint32 count_vph = 2;
  optional string detector_id = 3;
  google.protobuf.Timestamp last_update = 4;
  optional uint32 occupancy_pct = 5;
  optional DetectorRole role = 6;
  optional string speed_kmh = 7;
}

message MainlineDetectors {
  repeated MainlineDetectorsDetector detector = 1;
}

message MainlineDetectorsDetector {
  optional string detector_id = 1;
  MainlineDetectorsDetectorConfig config = 2;
  MainlineDetectorsDetectorState state = 3;
}

message MainlineDetectorsDetectorConfig {
  optional string detector_id = 1;
  optional DetectorRole role = 2;
}

message MainlineDetectorsDetectorState {
  optional bool active = 1;
  optional uint32 count_vph = 2;
  optional string detector_id = 3;
  google.protobuf.Timestamp last_update = 4;
  optional uint32 occupancy_pct = 5;
  optional DetectorRole role = 6;
  optional string speed_kmh = 7;
}

message Diagnostics {
  optional uint32 controller_uptime_s = 2;
  google.protobuf.Timestamp last_self_test = 3;
  optional uint32 signal_head_faults = 4;
}

message Faults {
  repeated Fault fault = 1;
}

message Fault {
  optional string category = 1;
  optional string correlates_with = 6;
  optional string description = 2;
  optional string fault_id = 3;
  google.protobuf.Timestamp first_observed = 4;
  optional FaultSeverity severity = 5;
}

