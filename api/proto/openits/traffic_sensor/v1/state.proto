syntax = "proto3";

package openits.traffic_sensor.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/traffic_sensor/v1;trafficsensorv1";

import "google/protobuf/timestamp.proto";
import "openits/traffic_sensor/v1/types.proto";

message TrafficSensor {
  TrafficSensorConfig config = 1;
  TrafficSensorState state = 2;
  Associations associations = 8;
  Configuration configuration = 3;
  Lanes lanes = 4;
  Queues queues = 5;
  Diagnostics diagnostics = 6;
  Faults faults = 7;
}

message TrafficSensorConfig {
  optional string elevation = 1;
  optional uint32 heading = 2;
  optional string id = 8;
  google.protobuf.Timestamp install_date = 7;
  optional string latitude = 3;
  TrafficSensorConfigLinearReference linear_reference = 9;
  optional string longitude = 4;
  optional string maintained_by = 10;
  optional string name = 5;
  optional string owner = 11;
  optional string road_reference = 6;
  optional string site_id = 12;
}

message TrafficSensorConfigLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message TrafficSensorState {
  optional OperationalStatus operational_status = 1;
  optional string inactive_reason = 2;
  optional string elevation = 3;
  optional string firmware = 4;
  optional string firmware_build = 15;
  optional string hardware_version = 16;
  optional uint32 heading = 5;
  optional string id = 14;
  google.protobuf.Timestamp install_date = 12;
  optional string latitude = 6;
  TrafficSensorStateLinearReference linear_reference = 17;
  optional string longitude = 7;
  optional string maintained_by = 18;
  optional string make = 8;
  optional string model = 9;
  optional string name = 10;
  optional string owner = 19;
  optional string road_reference = 11;
  optional string serial = 13;
  optional string site_id = 20;
}

message TrafficSensorStateLinearReference {
  optional string route_designator = 1;
  optional string direction = 2;
  optional string measure = 3;
  optional string lrs_method = 4;
}

message Associations {
  repeated AssociatedDevice associated_device = 1;
}

message AssociatedDevice {
  optional string device_id = 1;
  optional string role = 2;
  optional string note = 3;
}

message Configuration {
  optional uint32 data_interval_s = 1;
  optional LaneNumberingOrigin lane_numbering_origin = 4;
  optional MountingSide mounting_side = 5;
  optional string classification_scheme = 3;
  repeated VehicleClass vehicle_class = 2;
  repeated ConfigurationQueueZone queue_zone = 6;
}

message VehicleClass {
  optional uint32 class_id = 1;
  optional string name = 2;
  optional string min_length_m = 3;
  optional string max_length_m = 4;
  optional uint32 min_axle_count = 5;
  optional uint32 max_axle_count = 6;
}

message ConfigurationQueueZone {
  optional string zone_id = 1;
  optional string name = 2;
  optional uint32 lane_reference = 3;
  optional string carriageway = 4;
  optional string downstream_reference = 5;
}

message Lanes {
  repeated LanesLane lane = 1;
}

message LanesLane {
  optional uint32 lane_id = 1;
  LanesLaneConfig config = 2;
  LanesLaneState state = 3;
}

message LanesLaneConfig {
  optional string carriageway = 1;
  optional string effective_zone_length_m = 5;
  optional uint32 lane_id = 2;
  optional string name = 3;
  optional uint32 travel_heading = 4;
}

message LanesLaneState {
  optional OperationalStatus operational_status = 8;
  Interval interval = 1;
  Presence presence = 2;
  optional string carriageway = 3;
  optional string effective_zone_length_m = 7;
  optional uint32 lane_id = 4;
  optional string name = 5;
  optional uint32 travel_heading = 6;
}

message Interval {
  repeated IntervalClassVolume class_volume = 1;
  optional DataQuality data_quality = 12;
  optional string density = 2;
  optional uint32 flow_rate_vph = 3;
  optional string gap_average_s = 4;
  optional string headway_average_s = 5;
  optional uint32 interval_duration_s = 6;
  google.protobuf.Timestamp interval_start = 7;
  optional string mean_vehicle_length_m = 16;
  optional string occupancy = 8;
  optional string speed_85th_percentile_kmh = 9;
  optional string speed_average_kmh = 10;
  optional string speed_space_mean_kmh = 13;
  optional string speed_std_dev_kmh = 17;
  optional uint32 unclassified_volume = 15;
  optional string uptime_percent = 14;
  optional uint32 volume = 11;
  optional uint32 wrong_way_volume = 18;
}

message IntervalClassVolume {
  optional uint32 class_id = 1;
  optional uint32 volume = 2;
}

message Presence {
  optional bool occupied = 1;
  google.protobuf.Timestamp last_detection = 2;
}

message Queues {
  repeated QueuesQueueZone queue_zone = 1;
}

message QueuesQueueZone {
  optional string zone_id = 1;
  optional uint32 back_of_queue_m = 2;
  optional uint32 queue_duration_s = 3;
  optional uint32 queue_length_m = 4;
  google.protobuf.Timestamp queue_start = 5;
  optional bool queueing = 6;
}

message Diagnostics {
  reserved 5;
  reserved "rf_signal_quality";
  optional uint32 signal_quality = 1;
  optional string internal_temperature_c = 6;
  optional uint64 uptime_s = 7;
  google.protobuf.Timestamp last_self_test = 3;
  Calibration calibration = 2;
}

message Calibration {
  google.protobuf.Timestamp last_calibrated = 1;
  optional Status status = 2;
}

message Faults {
  repeated Fault fault = 1;
}

message Fault {
  optional string category = 1;
  optional string correlates_with = 6;
  optional string description = 2;
  optional string fault_id = 3;
  google.protobuf.Timestamp first_observed = 4;
  optional FaultSeverity severity = 5;
}

