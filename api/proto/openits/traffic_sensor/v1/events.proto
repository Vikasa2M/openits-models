syntax = "proto3";

package openits.traffic_sensor.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/traffic_sensor/v1;trafficsensorv1";

import "google/protobuf/timestamp.proto";
import "openits/traffic_sensor/v1/types.proto";

message QueueStateChanged {
  string kind = 99;
  optional string zone_id = 1;
  optional uint32 back_of_queue_m = 10;
  optional string observed_by = 5;
  google.protobuf.Timestamp occurred_at = 6;
  optional string owner = 7;
  optional uint32 queue_duration_s = 3;
  optional uint32 queue_length_m = 11;
  google.protobuf.Timestamp queue_start = 4;
  optional bool queueing = 2;
  uint64 sequence = 8;
  string source_device_id = 9;
}

message TrafficIntervalReport {
  string kind = 99;
  repeated TrafficIntervalReportLane lane = 1;
  optional string observed_by = 2;
  google.protobuf.Timestamp occurred_at = 3;
  optional string owner = 4;
  uint64 sequence = 5;
  string source_device_id = 6;
}

message TrafficIntervalReportLane {
  optional uint32 lane_id = 1;
  optional string name = 2;
  optional string carriageway = 3;
  repeated TrafficIntervalReportLaneClassVolume class_volume = 4;
  optional DataQuality data_quality = 15;
  optional string density = 5;
  optional uint32 flow_rate_vph = 6;
  optional string gap_average_s = 7;
  optional string headway_average_s = 8;
  optional uint32 interval_duration_s = 9;
  google.protobuf.Timestamp interval_start = 10;
  optional string mean_vehicle_length_m = 19;
  optional string occupancy = 11;
  optional string speed_85th_percentile_kmh = 12;
  optional string speed_average_kmh = 13;
  optional string speed_space_mean_kmh = 16;
  optional string speed_std_dev_kmh = 20;
  optional uint32 unclassified_volume = 18;
  optional string uptime_percent = 17;
  optional uint32 volume = 14;
  optional uint32 wrong_way_volume = 21;
}

message TrafficIntervalReportLaneClassVolume {
  optional uint32 class_id = 1;
  optional uint32 volume = 2;
}

message TrafficSensorStatusReport {
  string kind = 99;
  optional string name = 1;
  optional OperationalStatus operational_status = 4;
  optional string inactive_reason = 5;
  optional string latitude = 2;
  optional string longitude = 3;
  optional string observed_by = 6;
  google.protobuf.Timestamp occurred_at = 7;
  optional string owner = 8;
  uint64 sequence = 9;
  string source_device_id = 10;
}

