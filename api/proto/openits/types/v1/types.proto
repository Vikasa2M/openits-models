syntax = "proto3";

package openits.types.v1;

option go_package = "github.com/Vikasa2M/openits-models/pkg/proto/openits/types/v1;typesv1";

message WireSource {
  string decoder = 1;
  oneof tag {
    Indiana indiana = 2;
    NtcipOid ntcip_oid = 3;
    uint32 message_id = 4;
    PlcRegister plc_register = 5;
  }
  message Indiana {
    optional uint32 indiana_code = 1;
    optional uint32 indiana_param = 2;
  }

  message NtcipOid {
    optional string oid = 1;
    optional string oid_value = 2;
  }

  message PlcRegister {
    optional string register = 1;
    optional string register_value = 2;
  }
}

message ScOnBatteryPolicy {
  optional OnBatteryMode mode = 1;
  optional uint32 transition_at_soc_pct = 2;
  optional uint32 transition_at_runtime_minutes = 3;
}

enum OnBatteryMode {
  ON_BATTERY_MODE_UNSPECIFIED = 0;
  ON_BATTERY_MODE_FULL_OPERATION = 1;
  ON_BATTERY_MODE_FLASH = 2;
}

